      type: object
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string
    FetchMeta:
      type: object
      required:
        - last_updated
      properties:
        last_updated:
          type: string
          example: '2023-02-02T21:00:00.000Z'
          description: Timestamp when the data was last updated from ZRA
    Notice:
      type: object
      required:
        - notice_number
        - notice_date
        - title
        - content
        - by
      properties:
        notice_number:
          type: string
          example: 3
          description: Notice number from ZRA
        notice_date:
          type: string
          description: Notice date-time in IS0 8601 format
          example: '2023-02-02T21:00:00.000Z'
        title:
          type: string
          example: Call to Action
        content:
          type: string
          example: Call to Action
        by:
          type: string
          example: ZAMBIA REVENUE AUTHORITY
        detail_url:
          type: string
          example: https://hello.zra.go.ke
