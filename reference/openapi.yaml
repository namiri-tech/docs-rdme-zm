          description: The purchase date in YYYYMMDD format.
          example: '20260714'
        purchase_number:
          type: string
          description: The purchase number assigned to the transaction.
          example: PUR24-234-565378-VFRDEF
        supplier_id:
          type: string
          description: The DigiTax ID of the supplier.
          example: supplier_01J4PRP9V3W2R42EPPCR8WRY47
        supplier_invoice_number:
          type: integer
          description: The invoice number issued by the supplier.
          example: 12
        status:
          type: string
          enum:
            - PENDING
            - FAILED
            - COMPLETED
          description: The purchase's synchronization status with ZRA.
          example: COMPLETED
        purchase_status_code:
          type: string
          description: The ZRA purchase status code.
          example: 2
        item_list:
          type: array
          description: The items and amounts included in the purchase.
          items:
            $ref: '#/components/schemas/PurchaseItem'
    PurchaseItem:
      type: object
      description: A line item included in a purchase.
      required:
        - id
        - quantity
        - unit_price
        - supply_price
        - discount_rate
        - discount_amount
        - item_id
        - total_amount
        - vat_tax_amount
        - vat_taxable_amount
        - item_name
        - item_class_code
        - item_code
      properties:
        id:
          type: string
          description: The DigiTax ID of this purchase line item.
          example: purchaseitem_01HC3J1VVVM05YCTS61G7V3KC6
        quantity:
          type: number
          description: The number of units purchased.
          example: 10
        total_amount:
          type: number
          description: The total amount for the line item, with up to four decimal places.
          example: 1160
        vat_tax_amount:
          type: number
          description: >-
            The VAT amount recorded for the line item, with up to four decimal
            places.
          example: 160
        vat_taxable_amount:
          type: number
          description: The line item amount subject to VAT, with up to four decimal places.
          example: 1000
        ipl_tax_amount:
          type: number
          description: >-
            The Insurance Premium Levy amount recorded for the line item, with
            up to four decimal places.
          example: 160
        ipl_taxable_amount:
          type: number
          description: >-
            The line item amount subject to Insurance Premium Levy, with up to
            four decimal places.
          example: 1000
        tl_tax_amount:
          type: number
          description: >-
            The Tourism Levy amount recorded for the line item, with up to four
            decimal places.
          example: 160
        tl_taxable_amount:
          type: number
          description: >-
            The line item amount subject to Tourism Levy, with up to four
            decimal places.
          example: 1000
        excise_tax_amount:
          type: number
          description: >-
            The excise duty amount recorded for the line item, with up to four
            decimal places.
          example: 160
        excise_taxable_amount:
          type: number
          description: >-
            The line item amount subject to excise duty, with up to four decimal
            places.
          example: 1000
        unit_price:
          type: number
          description: The price per unit of the item, with up to four decimal places.
          example: 116
        supply_price:
          type: number
          description: >-
            The supply amount recorded for the line item, with up to four
            decimal places.
          example: 1160
        discount_rate:
          type: number
          description: The discount rate applied to the line item, as a decimal.
          example: 0
        discount_amount:
          type: number
          description: >-
            The discount amount applied to the line item, with up to four
            decimal places.
          example: 0
        item_id:
          type: string
          description: The DigiTax ID of the catalogue item.
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
        packing_unit_code:
          type: string
          description: >-
            The code for the item's packaging unit. See the [Packaging Unit
            Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#packaging-unit-codes).
          example: BG
        item_name:
          type: string
          description: The name of the purchased item.
          example: African Literature
        item_class_code:
          type: string
          description: >-
            The ZRA classification code of the purchased item. See the [Item
            Classification
            Table](https://zm.docs.digitax.tech/docs/items-item-classification-table)
            for sandbox and production codes.
          example: '50102518'
        item_code:
          type: string
          description: The item code recorded for the purchase line.
          example: '20056'
        approved_quantity:
          type: number
          description: >-
            The quantity supplied when linking the purchase line to a catalogue
            item.
          example: 1
    ItemComposition:
      type: object
      description: A component item and quantity used to make another item.
      required:
        - id
        - item_id
        - composition_item_id
        - composition_item_quantity
        - business_id
      properties:
        id:
          type: string
          description: The DigiTax ID of this item composition record.
          example: itemcomposition_01J58XV8W45SHFZGKVERMB5XCA
        item_id:
          type: string
          description: The DigiTax ID of the item being composed.
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
        composition_item_id:
          type: string
          description: The DigiTax ID of a component item.
          example: item_01J47XGVT004DFVCVFYN50SRSF
        composition_item_quantity:
          type: integer
          description: The quantity of the component item used in the composed item.
          example: 30
    OfflineUrlSale:
      type: object
      description: >-
        Sale and receipt details returned for the specified business and trader
        invoice number.
      required:
        - sale_date
        - trader_invoice_number
        - receipt_number
        - id
        - sdc_id
        - internal_data
        - receipt_signature
        - receipt_url
        - sales_tax_summary
        - status
        - total
        - business_details
        - customer_details
        - items
      properties:
        id:
          type: string
          description: The DigiTax ID of the sale.
          example: sale_01HC3HTDAXQ50E07CWR2A2CFBD
        trader_invoice_number:
          type: string
          description: >-
            The invoice reference from your system, or the DigiTax sale number
            if no reference was supplied.
          example: '12345678901'
        original_sale_id:
          type: string
          description: >-
            The DigiTax ID of the original sale linked to a credit or debit
            note. This endpoint does not include this field in its response.
        receipt_type_code:
          type: string
          description: >-
            The ZRA receipt type code. See the [Receipt Type Codes
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#receipt-type-codes).
            This endpoint does not include this field in its response.
        sale_number:
          type: string
          description: >-
            The sale number assigned by DigiTax. This endpoint does not include
            this field in its response.
        kind:
          type: string
          enum:
            - NORMAL
            - LPO
            - EXPORT
          description: >-
            The sale type (NORMAL, LPO, or EXPORT). This endpoint does not
            include this field in its response.
        receipt_number:
          type: integer
          description: The receipt number assigned by ZRA.
          example: 38
        lpo_number:
          type: string
          description: >-
            The local purchase order number for an LPO sale. This endpoint does
            not include this field in its response.
        destination_country_code:
          type: string
          description: >-
            The destination country code for an export sale. See the [Country
            Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#country-codes).
            This endpoint does not include this field in its response.
        reason_code:
          type: string
          description: >-
            The reason code for a credit or debit note. See the [Refund Reason
            Code
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#refund-reason-code)
            for credit notes or the [Debit Reason Code
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#debit-reason-code)
            for debit notes. This endpoint does not include this field in its
            response.
        currency_code:
          type: string
          description: >-
            The currency code used for the transaction. See the [Currency Code
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#currency-code).
          example: ZMW
        exchange_rate:
          type: number
          description: The exchange rate for a sale made in a currency other than ZMW.
          example: 123.45
        sales_tax_summary:
          type: object
          description: Taxable and tax amounts summed across the sale's line items.
          required:
            - taxable_amount_vat
            - taxable_amount_ipl
            - taxable_amount_tl
            - taxable_amount_excise
            - tax_amount_vat
            - tax_amount_ipl
            - tax_amount_tl
            - tax_amount_excise
            - taxable_amount_tot
            - tax_amount_tot
          properties:
            taxable_amount_vat:
              type: number
              description: Total amount subject to VAT, with up to four decimal places.
              example: 0
            taxable_amount_ipl:
              type: number
              description: >-
                Total amount subject to Insurance Premium Levy, with up to four
                decimal places.
              example: 517.24
            taxable_amount_tl:
              type: number
              description: >-
                Total amount subject to Tourism Levy, with up to four decimal
                places.
              example: 0
            taxable_amount_excise:
              type: number
              description: >-
                Total amount subject to excise duty, with up to four decimal
                places.
              example: 0
            taxable_amount_tot:
              type: number
              description: >-
                Total amount subject to turnover tax, with up to four decimal
                places.
              example: 0
            tax_amount_vat:
              type: number
              description: Total VAT charged, with up to four decimal places.
              example: 0
            tax_amount_ipl:
              type: number
              description: >-
                Total Insurance Premium Levy charged, with up to four decimal
                places.
              example: 517.24
            tax_amount_tl:
              type: number
              description: Total Tourism Levy charged, with up to four decimal places.
              example: 0
            tax_amount_excise:
              type: number
              description: Total excise duty charged, with up to four decimal places.
              example: 0
            tax_amount_tot:
              type: number
              description: Total turnover tax charged, with up to four decimal places.
              example: 0
        internal_data:
          type: string
          description: Internal data returned by ZRA for the transaction.
          example: PB3ZSZP3RZR3AUPYBYLUTFJDIA
        receipt_signature:
          type: string
          description: The receipt signature returned by ZRA.
          example: 3JYZVPTPMYBGHG4A
        sdc_id:
          type: string
          description: >-
            The identifier of the sales data controller (SDC) that processed the
            transaction.
          example: SDC1234567890
        receipt_url:
          type: string
          description: URL for the ZRA receipt.
          example: >-
            https://sandboxportal.zra.org.zm/common/link/ebm/receipt/indexEbmReceiptData?Data=2002720806000YXO7XG3HRQ7OOWDH
          format: url
        status:
          type: string
          enum:
            - pending
            - failed
            - completed
          description: The transaction's synchronization status with ZRA.
          example: completed
        sale_date:
          type: string
          description: The date of the sale in YYYY-MM-DD format.
          example: '2026-07-14'
        created_at:
          type: string
          description: >-
            The date and time the sale record was created. This endpoint does
            not include this field in its response.
        cash_discount_rate:
          type: number
          description: >-
            The sale-level discount rate as a decimal; for example, 0.1
            represents 10%.
          example: 0
        cash_discount_amount:
          type: number
          description: The sale-level discount amount, with up to four decimal places.
          example: 0
        total:
          type: number
          description: >-
            The total amount charged for the sale, with up to four decimal
            places.
          example: 1160
        business_details:
          type: object
          description: The business details printed on the receipt.
          required:
            - name
            - pin
            - email
            - phone
            - location
          properties:
            name:
              type: string
              description: The business name.
              example: Business Name
            pin:
              type: string
              description: The business's TPIN.
              example: '1012345678'
            email:
              type: string
              description: The business's email address.
              example: support@digitax.tech
            phone:
              type: string
              description: The business's phone number.
              example: 260712345678
            location:
              type: string
              description: The business's location.
              example: Lusaka
        customer_details:
          type: object
          description: The customer details printed on the receipt.
          required:
            - name
            - pin
            - email
            - phone
          properties:
            name:
              type: string
              description: The customer's name.
              example: John Doe
            pin:
              type: string
              description: The customer's TPIN.
              example: '1065478391'
            email:
              type: string
              description: The customer's email address.
              example: support@namiri.tech
            phone:
              type: string
              description: The customer's phone number.
              example: 260712345678
        items:
          type: array
          description: The sale line items shown on the receipt.
          items:
            type: object
            required:
              - id
              - name
              - price
              - currency
              - quantity
            properties:
              id:
                type: string
                description: The DigiTax ID of the catalogue item.
                example: item_01HC3J1VVVM05YCTS61G7V3KC6
              name:
                type: string
                description: The item name shown on the receipt.
                example: DigiTax Product 01
              price:
                type: number
                description: >-
                  The price per unit of the item, with up to four decimal
                  places.
                example: 600
              currency:
                type: string
                description: The currency code for the item price.
                example: ZMW
              quantity:
                type: number
                description: The number of units sold.
                example: 1
        logo_url:
          type: string
          description: >-
            URL of the business logo shown on the receipt. This endpoint does
            not include this field in its response.
  parameters:
    After:
      in: query
      name: after
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID after which we want
          results
        example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
    Before:
      in: query
      name: before
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID before which we want
          results
        example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
    PageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        maximum: 20
        minimum: 1
        description: The maximum number of items to return per page, defaults to 20
        example: 20
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
tags: []
