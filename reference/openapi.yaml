openapi: 3.0.1
info:
  title: DigiTax
  description: DigiTax Public API
  version: '2'
  termsOfService: https://digitax.tech/page/terms
  contact:
    name: DigiTax
    url: https://digitax.tech
    email: support@namiri.tech
  license:
    name: Apache 2.0
servers:
  - url: https://api.digitax.tech/zm/v1
    description: Production
paths:
  /info:
    get:
      summary: Get ZRA information on the business
      tags:
        - Businesses
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items:
    post:
      tags:
        - Items
      summary: Create an item
      description: Create an item
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_class_code
                - item_type_code
                - item_name
                - origin_nation_code
                - package_unit_code
                - quantity_unit_code
                - vat_category_code
                - default_unit_price
              properties:
                item_class_code:
                  type: string
                  description: The item class code of the item
                  example: '15000000'
                item_type_code:
                  type: string
                  description: The item type code of the item
                  example: '2'
                item_name:
                  type: string
                  description: The name of the item
                  example: DigiTax Product 01
                origin_nation_code:
                  type: string
                  description: The country of origin code of the item
                  example: ZM
                package_unit_code:
                  type: string
                  description: The package unit code of the item
                  example: CT
                quantity_unit_code:
                  type: string
                  description: The quantity unit code of the item
                  example: BX
                vat_category_code:
                  type: string
                  description: The VAT category code of the item
                  example: A
                ipl_category_code:
                  type: string
                  description: The Insurance Premium Levy category code of the item
                  example: IPL1
                tl_category_code:
                  type: string
                  description: The Tourism Levy category code of the item
                  example: TL
                excise_category_code:
                  type: string
                  description: The Excise duty category code of the item
                  example: EXEEG
                tot_category_code:
                  type: string
                  description: The turn over tax category code of the item
                  example: TOT
                default_unit_price:
                  type: number
                  description: The default price of the item
                  example: 1000
                stock_quantity:
                  type: number
                  description: Starting stock quantity
                  example: 1000
                insurable:
                  type: boolean
                  description: Is the item insurable?
                  example: false
                callback_url:
                  type: string
                  description: >-
                    The callback url to call when we have new information about
                    the item, usually after syncing with ZRA
                  example: https://example.site/services/digitaxQueueReceiverPROXY
                bar_code:
                  type: string
                  description: The bar code or unique product code(UPC) of the item
                  example: '012345678905'
                recommended_retail_price:
                  type: number
                  description: Recommended Retailed Price as set by the manufacturer
                  example: 1000
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get list of items owned by the business
      description: Get list of items owned by the business
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{item_id}:
    parameters:
      - in: path
        name: item_id
        required: true
        description: Item ID in Digitax
        schema:
          type: string
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
    put:
      tags:
        - Items
      summary: Update an item
      description: Update an item
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_name:
                  type: string
                  example: Hello food
                default_unit_price:
                  type: number
                  description: The default price of the item up to 4 decimal places
                  example: 14
                recommended_retail_price:
                  type: number
                  description: Recommended Retailed Price as set by the manufacturer
                  example: 1000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get a specific item
      description: Get a specific item
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/item_composition/{item_id}:
    get:
      tags:
        - Items
      summary: Get item composition
      description: Get item composition
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: item_id
          required: true
          schema:
            type: string
            description: Item ID in Digitax
            example: item_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemComposition'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/item_composition:
    post:
      tags:
        - Items
      summary: Create item composition
      description: Create item composition
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_id:
                  type: string
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
                composition:
                  type: array
                  items:
                    type: object
                    required:
                      - composition_item_id
                      - quantity
                    properties:
                      composition_item_id:
                        type: string
                        example: item_01J47XGVT004DFVCVFYN50SRSF
                      quantity:
                        type: integer
                        example: 30
      responses:
        '201':
          description: Item composition created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemComposition'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers:
    get:
      tags:
        - Customers
      summary: Get a list of business customers
      description: Get a list of business customers
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Customers
      summary: Save business customer
      description: Save business customer
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
                - customer_tin
                - phone
              properties:
                customer_name:
                  type: string
                  description: Customer Name
                  example: John Doe
                customer_tin:
                  type: string
                  description: Customer Tax Identification Number (TIN)
                  example: '1012345678'
                email:
                  type: string
                  description: Customer Email Address
                  example: john@doe.com
                is_lpo:
                  type: boolean
                  description: Is this a LPO customer?
                  example: false
                phone:
                  type: string
                  description: Customer Phone Number
                  example: 260712345678
                address:
                  type: string
                  description: Customer physical address
                  example: 5 Aluguntugui Road, Lusaka
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customer_id}:
    get:
      tags:
        - Customers
      summary: Get a business customer
      description: Retrieves information about a customer given their ID on DigiTax
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            description: Customer ID on DigiTax
            example: customer_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports:
    get:
      tags:
        - Imports
      summary: Get list of import items received from ZRA
      description: Get list of import items received from ZRA
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - meta
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{import_id}/review:
    put:
      tags:
        - Imports
      summary: Approve or reject an import item
      description: Approve or reject an import item
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: import_id
          required: true
          schema:
            type: string
            description: Import ID in Digitax
            example: import_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reject
              properties:
                remarks:
                  type: string
                  description: Text reason for the rejection or approval
                  example: unrecognised import
                reject:
                  type: boolean
                  description: >-
                    Whether or not to reject the import item, if false it will
                    be approved, and rejected if true
                  example: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{import_id}/link:
    put:
      tags:
        - Imports
      summary: Link import item to an item in Digitax
      description: Link import item to an item in Digitax
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: import_id
          required: true
          schema:
            type: string
            description: Import ID in Digitax
            example: import_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_id
              properties:
                item_id:
                  type: string
                  description: The id of the item in Digitax
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
                quantity:
                  type: number
                  description: >-
                    The quantity of the item in Digitax to which the import item
                    is being linked. If 0, or not provided no stock will be
                    added for the item
                  example: 8
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers:
    get:
      tags:
        - Suppliers
      summary: Get a list of business suppliers
      description: Get a list of business suppliers
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Supplier'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Suppliers
      summary: Save business supplier
      description: Save business supplier
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - supplier_name
                - supplier_tin
              properties:
                supplier_name:
                  type: string
                  description: Supplier Name
                  example: Elite Books
                supplier_tin:
                  type: string
                  description: Supplier Tax Identification Number (TIN)
                  example: '1012345678'
                email:
                  type: string
                  description: Supplier Email Address
                  example: elite@books.com
                phone:
                  type: string
                  description: Supplier Phone Number
                  example: 260712345678
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers/{supplier_id}:
    get:
      tags:
        - Suppliers
      summary: Get a business supplier
      description: Retrieves information about a supplier given their ID on DigiTax
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: supplier_id
          required: true
          schema:
            type: string
            description: Supplier ID on DigiTax
            example: supplier_01J56FWS9KV3KAS0RHD4QJ1QCT
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases:
    get:
      tags:
        - Purchases
      summary: List purchases
      description: Get a list of purchases
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                  - meta
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Purchases
      summary: Add manual purchase
      description: Add manual purchase
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - purchase_date
              properties:
                purchase_date:
                  type: string
                  format: date
                  example: '2024-08-13'
                supplier_tin:
                  type: string
                  example: '1234567890'
                supplier_name:
                  type: string
                  example: John Doe
                supplier_email:
                  type: string
                  example: john@doe.com
                supplier_phone:
                  type: string
                  example: '+260712445689'
                supplier_id:
                  type: string
                  example: supplier_01J2CQMAZG1YCJ82YWQH6BHEKS
                supplier_invoice_number:
                  type: integer
                  format: int32
                  description: >-
                    Invoice number on the supplier's Certified Invoicing
                    Solution (CIS), must be unique across all purchases
                  example: 340
                payment_type_code:
                  type: string
                  example: '07'
                reject:
                  type: boolean
                  description: >-
                    Whether to create the purchase with the approved or rejected
                    status
                  example: false
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - item_id
                      - quantity
                      - unit_price
                      - discount_rate
                      - discount_amount
                      - total_amount
                    properties:
                      item_id:
                        type: string
                        example: item_01J55G02W1TY6YVFBMJHYKCENK
                      quantity:
                        type: number
                        example: 1
                      unit_price:
                        type: number
                        description: Amount up to 4 decimal places
                        example: 1000
                      total_amount:
                        type: number
                        description: Amount up to 4 decimal places
                        example: 1000
                      package_unit_quantity:
                        type: number
                        example: 1
                      discount_rate:
                        type: number
                        description: Discount rate in decimal form i.e. 0.1 = 10%,
                        maximum: 1
                        example: 0
                      discount_amount:
                        type: number
                        description: Amount up to 4 decimal places
                        example: 0
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}:
    get:
      tags:
        - Purchases
      summary: Get specific purchase
      description: Get specific purchase
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            description: Purchase ID in Digitax
            example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}/link-items:
    put:
      tags:
        - Purchases
      summary: Link purchase item to item
      description: Link purchase item to item
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
          description: Purchase id
          example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - purchase_item_id
                      - item_id
                    properties:
                      purchase_item_id:
                        type: string
                        example: purchaseitem_01HC3J1VVVM05YCTS61G7V3KC6
                      item_id:
                        type: string
                        example: item_01HC3J1VVVM05YCTS61G7V3KC6
                      quantity:
                        type: number
                        description: >-
                          The quantity of the item in Digitax to which the
                          purchase item is being linked. If 0, no stock will be
                          added for the item
                        example: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}/review:
    put:
      tags:
        - Purchases
      summary: Approve or reject a purchase
      description: Approve or reject a purchase
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
          description: Purchase id
          example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reject
              properties:
                reject:
                  type: boolean
                  description: Whether or not to reject the purchase
                  example: false
                comment:
                  type: string
                  example: double entry
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sales:
    post:
      tags:
        - Sales
      summary: Add sale
      description: Add sale
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trader_invoice_number
                - items
                - sale_date
                - currency_code
                - kind
              properties:
                kind:
                  type: string
                  enum:
                    - NORMAL
                    - LPO
                    - EXPORT
                  example: NORMAL
                sale_date:
                  type: string
                  format: date
                  example: '2024-08-13'
                currency_code:
                  type: string
                  example: ZMW
                customer_tpin:
                  type: string
                  example: '1065478391'
                customer_name:
                  type: string
                  example: John Doe
                customer_phone:
                  type: string
                  example: '0651234567'
                customer_id:
                  type: string
                  example: customer_01J53RMNH66ADPH81DTV5MCZ3Y
                trader_invoice_number:
                  type: string
                  description: >-
                    Invoice number on the taxpayer's Certified Invoicing
                    Solution (CIS), must be unique across all sale types
                  example: '12345678901'
                exchange_rate:
                  type: number
                  description: Required when creating a sale with a foreign currency
                  example: 123.45
                destination_country_code:
                  type: string
                  description: Required when creating an Export Sale
                  example: KE
                lpo_number:
                  type: string
                  description: Required when creating an LPO Sale
                  example: K37343645634534E
                payment_type_code:
                  type: string
                  example: '07'
                callback_url:
                  type: string
                  example: https://example.com/callback
                cash_discount_rate:
                  type: number
                  description: Discount rate in decimal form i.e. 0.1 = 10%
                  example: 0
                cash_discount_amount:
                  type: number
                  description: Amount up to 4 decimal places
                  example: 0
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - item_id
                      - quantity
                      - unit_price
                      - discount_rate
                      - discount_amount
                      - total_amount
                    properties:
                      item_id:
                        type: string
                        example: item_01J55G02W1TY6YVFBMJHYKCENK
                      quantity:
                        type: number
                        example: 1
                      unit_price:
                        type: number
                        description: Amount up to 4 decimal places
                        example: 1000
                      total_amount:
                        type: number
                        description: Amount up to 4 decimal places
