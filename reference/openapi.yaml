  parameters:
    After:
      in: query
      name: after
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID after which we want
          results
        example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
    Before:
      in: query
      name: before
      required: false
      schema:
        type: string
        description: >-
          When paginating results, a pointer to an ID before which we want
          results
        example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
    PageSize:
      in: query
      name: page_size
      required: false
      schema:
        type: integer
        maximum: 20
        minimum: 1
        description: The maximum number of items to return per page, defaults to 20
        example: 20
