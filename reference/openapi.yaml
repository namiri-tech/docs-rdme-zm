      properties:
        id:
          type: string
          description: Supplier ID
          example: supplier_01J56FWS9KV3KAS0RHD4QJ1QCT
        supplier_name:
          type: string
          description: Supplier Name
          example: Elite Books
        email:
          type: string
          description: Supplier Email
          example: elite@books.com
        phone:
          type: string
          description: Supplier Phone Number
          example: '+260712345678'
        supplier_tpin:
          type: string
