openapi: 3.0.1
info:
  title: DigiTax Zambia API Endpoints
  description: DigiTax Zambia Public API
  version: '3'
  termsOfService: https://docs.digitax.tech/page/terms
  contact:
    name: DigiTax
    url: https://digitax.tech
    email: support@namiri.tech
  license:
    name: Apache 2.0
servers:
  - url: https://api.digitax.tech/zm/v1
    description: Production
paths:
  /info:
    get:
      summary: Get ZRA information on the business
      description: >-
        Returns the branch and ZRA registration information for the
        authenticated business.
      tags:
        - Businesses
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items:
    post:
      tags:
        - Items
      summary: Create an item
      description: Creates an item in the authenticated business's item catalogue.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_class_code
                - item_type_code
                - item_name
                - origin_nation_code
                - package_unit_code
                - quantity_unit_code
                - vat_category_code
                - default_unit_price
              properties:
                item_class_code:
                  type: string
                  description: >-
                    The ZRA item classification code for the item. See the [Item
                    Classification
                    Table](https://zm.docs.digitax.tech/docs/items-item-classification-table)
                    for sandbox and production codes.
                  example: '15000000'
                item_type_code:
                  type: string
                  description: >-
                    The item type code. See the [Item Type codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#item-type-codes)
                    for possible values.
                  example: '2'
                item_name:
                  type: string
                  description: The name used to identify the item.
                  example: DigiTax Product 01
                origin_nation_code:
                  type: string
                  description: >-
                    The country code for the item's country of origin. See the
                    [Country Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#country-codes)
                    for possible values.
                  example: ZM
                package_unit_code:
                  type: string
                  description: >-
                    The code for the unit used to package the item. See the
                    [Packaging Unit Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#packaging-unit-codes).
                  example: CT
                quantity_unit_code:
                  type: string
                  description: >-
                    The code for the unit used to measure the item's quantity.
                    See the [Quantity Unit Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#quantity-unit-codes).
                  example: BX
                vat_category_code:
                  type: string
                  description: >-
                    The code for the item's VAT category. See the VAT entries in
                    the [Taxation Type Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
                  example: A
                ipl_category_code:
                  type: string
                  description: >-
                    The code for the item's Insurance Premium Levy category. Use
                    IPL1 or IPL2 without hyphens; see the IPL entries in the
                    [Taxation Type Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes)
                    for their meanings. Cannot be combined with tl_category_code
                    or excise_category_code, and requires a VAT category with a
                    zero tax rate.
                  example: IPL1
                tl_category_code:
                  type: string
                  description: >-
                    The code for the item's Tourism Levy category. See the TL
                    entry in the [Taxation Type Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
                    Cannot be combined with ipl_category_code or
                    excise_category_code.
                  example: TL
                excise_category_code:
                  type: string
                  description: >-
                    The code for the item's excise duty category. See the LED
                    entries in the [Taxation Type Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
                    Cannot be combined with ipl_category_code or
                    tl_category_code.
                  example: EXEEG
                tot_category_code:
                  type: string
                  description: >-
                    The code for the item's turnover tax category. See the TOT
                    entry in the [Taxation Type Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
                  example: TOT
                default_unit_price:
                  type: number
                  description: >-
                    The default price per unit, at least 0.0001 and with up to
                    four decimal places.
                  example: 1000
                stock_quantity:
                  type: number
                  description: The item's starting stock quantity.
                  example: 1000
                insurable:
                  type: boolean
                  description: Indicates whether the item is insurable.
                  example: false
                callback_url:
                  type: string
                  description: >-
                    URL where DigiTax sends an HTTP POST callback with event
                    item.sync after the item successfully syncs with ZRA.
                  example: https://example.site/services/digitaxQueueReceiverPROXY
                bar_code:
                  type: string
                  description: The item's barcode or universal product code (UPC).
                  example: '012345678905'
                recommended_retail_price:
                  type: number
                  description: >-
                    The retail price recommended by the manufacturer, in major
                    currency units. Zero is allowed except when
                    vat_category_code is B; a nonzero value must be at least
                    0.0001 with up to four decimal places.
                  example: 1000
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get list of items owned by the business
      description: >-
        Returns a paginated list of items in the authenticated business's item
        catalogue.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    description: The catalogue items in this page.
                    items:
                      $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/{item_id}:
    parameters:
      - in: path
        name: item_id
        required: true
        description: Item ID in DigiTax
        schema:
          type: string
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
    put:
      tags:
        - Items
      summary: Update an item
      description: >-
        Updates the supplied name or prices for the item identified by its
        DigiTax ID.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_name:
                  type: string
                  description: >-
                    The updated name for the item. Omitted or empty values leave
                    the current name unchanged.
                  example: Hello food
                default_unit_price:
                  type: number
                  description: >-
                    The updated default price per unit, with up to four decimal
                    places. Omitted or zero values leave the current price
                    unchanged.
                  example: 14
                recommended_retail_price:
                  type: number
                  description: >-
                    The updated retail price recommended by the manufacturer,
                    with up to four decimal places. Omitted or zero values leave
                    the current price unchanged.
                  example: 1000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Items
      summary: Get a specific item
      description: Returns the item identified by its DigiTax ID.
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/item_composition/{item_id}:
    get:
      tags:
        - Items
      summary: Get item composition
      description: >-
        Returns the component items and quantities configured for the specified
        item.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: item_id
          required: true
          schema:
            type: string
            description: Item ID in DigiTax
            example: item_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemComposition'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /items/item_composition:
    post:
      tags:
        - Items
      summary: Create item composition
      description: >-
        Adds component items and quantities that make up an existing item. At
        least one supplied component must belong to the authenticated business,
        and an item cannot be a component of itself.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_id:
                  type: string
                  description: The DigiTax ID of the item whose composition is being set.
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
                composition:
                  type: array
                  description: The component items and their quantities.
                  items:
                    type: object
                    required:
                      - composition_item_id
                      - quantity
                    properties:
                      composition_item_id:
                        type: string
                        description: >-
                          The DigiTax ID of a component item. It must not be the
                          same as item_id.
                        example: item_01J47XGVT004DFVCVFYN50SRSF
                      quantity:
                        type: integer
                        description: >-
                          The quantity of this component item in the
                          composition.
                        example: 30
      responses:
        '201':
          description: Item composition created successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemComposition'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers:
    get:
      tags:
        - Customers
      summary: Get a list of business customers
      description: >-
        Returns a paginated list of customers associated with the authenticated
        business.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    description: The customers in this page.
                    items:
                      $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Customers
      summary: Save business customer
      description: Creates a customer record for the authenticated business.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - customer_name
                - customer_tin
                - phone
              properties:
                customer_name:
                  type: string
                  description: The customer's name.
                  example: John Doe
                customer_tin:
                  type: string
                  description: >-
                    The customer's Zambia Taxpayer Identification Number (TPIN),
                    exactly 10 digits.
                  example: '1012345678'
                email:
                  type: string
                  description: The customer's email address.
                  example: john@doe.com
                is_lpo:
                  type: boolean
                  description: >-
                    Indicates whether this customer is associated with local
                    purchase orders (LPOs).
                  example: false
                phone:
                  type: string
                  description: >-
                    The customer's phone number. Accepts a 10-digit local number
                    beginning with 0, or its equivalent with a +260 or 260
                    prefix. Spaces are removed before validation.
                  example: '+260712345678'
                address:
                  type: string
                  description: The customer's physical address.
                  example: 5 Aluguntugui Road, Lusaka
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /customers/{customer_id}:
    get:
      tags:
        - Customers
      summary: Get a business customer
      description: Retrieves information about a customer given their ID on DigiTax.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: customer_id
          required: true
          schema:
            type: string
            description: Customer ID on DigiTax
            example: customer_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports:
    get:
      tags:
        - Imports
      summary: Get list of import items received from ZRA
      description: >-
        Returns a paginated list of import items received from ZRA for the
        authenticated business.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - meta
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    type: array
                    description: The import records in this page.
                    items:
                      $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{import_id}/review:
    put:
      tags:
        - Imports
      summary: Approve or reject an import item
      description: >-
        Approves or rejects the specified import item and records the supplied
        remarks.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: import_id
          required: true
          schema:
            type: string
            description: Import ID in DigiTax
            example: import_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reject
              properties:
                remarks:
                  type: string
                  description: Remarks explaining the approval or rejection.
                  example: unrecognised import
                reject:
                  type: boolean
                  description: >-
                    Set to true to reject the import item or false to approve
                    it.
                  example: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /imports/{import_id}/link:
    put:
      tags:
        - Imports
      summary: Link import item to an item in DigiTax
      description: >-
        Links a reviewed import to a DigiTax catalogue item. For an approved
        import and a stock item, the supplied quantity is added to stock.
        Rejected imports do not add stock. An already-linked import is returned
        without adding stock again.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: import_id
          required: true
          schema:
            type: string
            description: Import ID in DigiTax
            example: import_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_id
              properties:
                item_id:
                  type: string
                  description: The DigiTax ID of the item to link to the import item.
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
                quantity:
                  type: number
                  description: >-
                    The quantity to add to stock when linking an approved import
                    to a stock item. If omitted or set to 0, no stock is added.
                    Services do not add stock.
                  example: 8
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Import'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers:
    get:
      tags:
        - Suppliers
      summary: Get a list of business suppliers
      description: Returns a paginated list of suppliers for the authenticated business.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    description: The suppliers in this page.
                    items:
                      $ref: '#/components/schemas/Supplier'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Suppliers
      summary: Save business supplier
      description: Creates a supplier record for the authenticated business.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - supplier_name
                - supplier_tin
              properties:
                supplier_name:
                  type: string
                  description: The supplier's name.
                  example: Elite Books
                supplier_tin:
                  type: string
                  description: >-
                    The supplier's Zambia Taxpayer Identification Number (TPIN),
                    exactly 10 digits.
                  example: '1012345678'
                email:
                  type: string
                  description: The supplier's email address.
                  example: elite@books.com
                phone:
                  type: string
                  description: The supplier's phone number.
                  example: 260712345678
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /suppliers/{supplier_id}:
    get:
      tags:
        - Suppliers
      summary: Get a business supplier
      description: Retrieves information about a supplier given their ID on DigiTax.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: supplier_id
          required: true
          schema:
            type: string
            description: Supplier ID on DigiTax
            example: supplier_01J56FWS9KV3KAS0RHD4QJ1QCT
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Supplier'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases:
    get:
      tags:
        - Purchases
      summary: List purchases
      description: >-
        Returns a paginated list of purchases associated with the authenticated
        business.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                  - meta
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/FetchMeta'
                  data:
                    type: array
                    description: The purchases in this page.
                    items:
                      $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Purchases
      summary: Add manual purchase
      description: Records a purchase and its line items for the authenticated business.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - purchase_date
              properties:
                purchase_date:
                  type: string
                  description: >-
                    The date the purchase was made, in YYYY-MM-DD format. Future
                    dates are rejected.
                  format: date
                  example: '2026-07-14'
                supplier_tin:
                  type: string
                  description: >-
                    The supplier's Zambia Taxpayer Identification Number (TPIN),
                    exactly 10 digits when used.
                  example: '1234567890'
                supplier_name:
                  type: string
                  description: The supplier's name.
                  example: John Doe
                supplier_email:
                  type: string
                  description: The supplier's email address.
                  example: john@doe.com
                supplier_phone:
                  type: string
                  description: The supplier's phone number.
                  example: '+260712345678'
                supplier_id:
                  type: string
                  description: >-
                    The DigiTax ID of an existing supplier. When supplied, this
                    supplier is used instead of supplier_tin.
                  example: supplier_01J2CQMAZG1YCJ82YWQH6BHEKS
                supplier_invoice_number:
                  type: integer
                  format: int32
                  description: >-
                    The invoice number from the supplier's system. It must be
                    unique for the same supplier within the business.
                  example: 340
                payment_type_code:
                  type: string
                  description: >-
                    The payment method code. See the [Payment Type Codes
                    table](https://zm.docs.digitax.tech/docs/sales-data-attributes#payment-type-codes)
                    for codes 01 through 07; the API also supports 08 for bank
                    transfer. Defaults to 01 when omitted or empty.
                  example: '07'
                reject:
                  type: boolean
                  description: >-
                    Set to true to record the purchase as rejected; otherwise it
                    is recorded as approved.
                  example: false
                items:
                  type: array
                  description: The purchase line items.
                  items:
                    type: object
                    required:
                      - item_id
                      - quantity
                      - unit_price
                      - discount_rate
                      - discount_amount
                      - total_amount
                    properties:
                      item_id:
                        type: string
                        description: The DigiTax ID of the item purchased.
                        example: item_01J55G02W1TY6YVFBMJHYKCENK
                      quantity:
                        type: number
                        description: The quantity of the item purchased.
                        example: 1
                      unit_price:
                        type: number
                        description: >-
                          The price per item, at least 0.0001 and with up to
                          four decimal places.
                        example: 1000
                      total_amount:
                        type: number
                        description: >-
                          The line total with at least 0.0001 with up to four
                          decimal places. Must equal quantity times unit_price
                          minus discount_amount, rounded to four decimal places.
                        example: 1000
                      package_unit_quantity:
                        type: number
                        description: The number of packages represented by this line item.
                        example: 1
                      discount_rate:
                        type: number
                        description: >-
                          The line discount rate, from 0 to 1. For example, 0.1
                          represents 10%.
                        maximum: 1
                        example: 0
                      discount_amount:
                        type: number
                        description: >-
                          The discount amount in major currency units. Zero is
                          allowed; a nonzero value must be at least 0.0001 with
                          up to four decimal places. It must not exceed
                          total_amount.
                        example: 0
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}:
    get:
      tags:
        - Purchases
      summary: Get specific purchase
      description: Returns the purchase identified by its DigiTax purchase ID.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
            description: Purchase ID in DigiTax
            example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}/link-items:
    put:
      tags:
        - Purchases
      summary: Link purchase item to item
      description: >-
        Links line items from an approved purchase to DigiTax catalogue items
        and adds the supplied quantities to stock for stock items.
        Already-linked lines are skipped without adding stock again. Manual
        purchases do not need linking.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
          description: Purchase id
          example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  description: >-
                    The purchase lines to link and the stock quantity to add for
                    each.
                  items:
                    type: object
                    required:
                      - purchase_item_id
                      - item_id
                    properties:
                      purchase_item_id:
                        type: string
                        description: The DigiTax ID of the purchase line item to link.
                        example: purchaseitem_01HC3J1VVVM05YCTS61G7V3KC6
                      item_id:
                        type: string
                        description: >-
                          The DigiTax ID of the catalogue item to link to the
                          purchase line.
                        example: item_01HC3J1VVVM05YCTS61G7V3KC6
                      quantity:
                        type: number
                        description: >-
                          The quantity to add to stock when linking the purchase
                          line to a catalogue item. If omitted or set to 0, no
                          stock is added. Services do not add stock.
                        example: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /purchases/{purchase_id}/review:
    put:
      tags:
        - Purchases
      summary: Approve or reject a purchase
      description: >-
        Approves or rejects the specified purchase and records the supplied
        comment.
      security:
        - apiKeyAuth: []
      parameters:
        - in: path
          name: purchase_id
          required: true
          schema:
            type: string
          description: Purchase id
          example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reject
              properties:
                reject:
                  type: boolean
                  description: Set to true to reject the purchase or false to approve it.
                  example: false
                comment:
                  type: string
                  description: Comment explaining the purchase review decision.
                  example: double entry
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purchase'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sales:
    post:
      tags:
        - Sales
      summary: Create a sale
      description: Creates a sale for the authenticated business.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - trader_invoice_number
                - items
                - sale_date
                - currency_code
                - kind
              properties:
                kind:
                  type: string
                  enum:
                    - NORMAL
                    - LPO
                    - EXPORT
                  description: >-
                    The sale type. Use LPO for a local purchase order sale or
                    EXPORT for an export sale. See [Types of
                    Sales](https://zm.docs.digitax.tech/docs/sales-data-attributes#types-of-sales)
                    for an overview.
                  example: NORMAL
                sale_date:
                  type: string
                  description: >-
                    The sale date in YYYY-MM-DD format. The service rejects
                    dates earlier than 29 days before or later than 29 days
                    after the current time in Africa/Lusaka.
                  format: date
                  example: '2026-07-14'
                currency_code:
                  type: string
                  description: >-
                    The sale currency code. See the [Currency Code
                    table](https://zm.docs.digitax.tech/docs/sales-data-attributes#currency-code)
                    for supported currencies. For a currency other than ZMW,
                    provide a positive exchange_rate.
                  example: ZMW
                customer_tpin:
                  type: string
                  description: >-
                    The customer's Zambia Taxpayer Identification Number (TPIN),
                    exactly 10 digits when used. For non-export sales without
                    customer_id, this is used to find or create the customer.
                    Ignored for export sales.
                  example: '1065478391'
                customer_name:
                  type: string
                  description: The customer's name.
                  example: John Doe
                customer_phone:
                  type: string
                  description: >-
                    The customer's phone number. When customer_tpin is used to
                    create a new customer, a supplied phone number must contain
                    exactly 10 characters. Unlike the customer-creation
                    endpoint, this endpoint does not normalize phone numbers.
                  example: '0651234567'
                customer_id:
                  type: string
                  description: >-
                    The DigiTax ID of an existing customer. Required for LPO
                    sales, where the customer must be registered as an LPO
                    customer. For non-export sales, this customer is used
                    instead of customer_tpin. Ignored for export sales.
                  example: customer_01J53RMNH66ADPH81DTV5MCZ3Y
                trader_invoice_number:
                  type: string
                  description: >-
                    The invoice reference from your system. It must be unique
                    across sales, credit notes, and debit notes in the business,
                    including failed transactions.
                  example: '12345678901'
                exchange_rate:
                  type: number
                  description: >-
                    The exchange rate to ZMW. Required and greater than zero
                    when currency_code is not ZMW.
                  example: 123.45
                destination_country_code:
                  type: string
                  description: >-
                    The destination country code for an export sale. See the
                    [Country Codes
                    table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#country-codes).
                    It is required for EXPORT sales and must not be ZM.
                  example: KE
                lpo_number:
                  type: string
                  description: The local purchase order number. Required for LPO sales.
                  example: K37343645634534E
                payment_type_code:
                  type: string
                  description: >-
                    The payment method code. See the [Payment Type Codes
                    table](https://zm.docs.digitax.tech/docs/sales-data-attributes#payment-type-codes)
                    for codes 01 through 07; the API also supports 08 for bank
                    transfer. Defaults to 01 when omitted or empty.
                  example: '07'
                callback_url:
                  type: string
                  description: >-
                    URL where DigiTax sends an HTTP POST callback with event
                    sale.sync after the sale successfully syncs with ZRA. Failed
                    syncs do not trigger this callback.
                  example: https://example.com/callback
                cash_discount_rate:
                  type: number
                  description: >-
                    The sale-level discount rate, from 0 to 1. For example, 0.1
                    represents 10%. When both this rate and cash_discount_amount
                    are nonzero, the amount must equal the sum of line totals
                    times this rate.
                  example: 0
                cash_discount_amount:
                  type: number
                  description: >-
                    The sale-level discount amount, in major currency units.
                    When both this amount and cash_discount_rate are nonzero,
                    they must agree. A nonzero sale-level discount rate or
                    amount cannot be combined with a line that has both a
                    nonzero discount_rate and discount_amount.
                  example: 0
                items:
                  type: array
                  description: The items included in the sale.
                  items:
                    type: object
                    required:
                      - item_id
                      - quantity
                      - unit_price
                      - package_unit_quantity
                      - discount_rate
                      - discount_amount
                      - total_amount
                    properties:
                      item_id:
                        type: string
                        description: The DigiTax ID of the catalogue item being sold.
                        example: item_01J55G02W1TY6YVFBMJHYKCENK
                      quantity:
                        type: number
                        description: >-
                          The number of units being sold. For stock items, the
                          quantity must not exceed the available stock.
                        example: 1
                      unit_price:
                        type: number
                        description: >-
                          The price per unit, in the sale currency, at least
                          0.0001 with up to four decimal places.
                        example: 1000
                      total_amount:
                        type: number
                        description: >-
                          The line total in the sale currency, at least 0.0001
                          with up to four decimal places. Must equal quantity
                          times unit_price minus discount_amount, rounded to
                          four decimal places. When discount_rate is nonzero, it
                          must also equal that calculation without rounding.
                        example: 1000
                      package_unit_quantity:
                        type: number
                        description: The number of packages represented by this line item.
                        example: 1
                      discount_rate:
                        type: number
                        description: >-
                          The line discount rate, from 0 to 1. For example, 0.1
                          represents 10%. When both this rate and
                          discount_amount are nonzero, discount_amount must
                          equal quantity * unit_price * discount_rate, and
                          discount_rate must equal discount_amount / (quantity *
                          unit_price).
                        maximum: 1
                        example: 0
                      discount_amount:
                        type: number
                        description: >-
                          The line discount in the sale currency. Zero is
                          allowed; a nonzero value must be at least 0.0001 with
                          up to four decimal places. It must not exceed
                          total_amount.
                        example: 0
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Sales
      summary: List normal sales
      description: >-
        Returns a paginated list of normal, LPO, and export sales for the
        authenticated business. Credit and debit notes are listed separately.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    description: The normal, LPO, and export sales in this page.
                    items:
                      $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /credit-notes:
    post:
      tags:
        - Sales
      summary: Create a credit note
      description: >-
        Creates a credit note for an existing sale using the supplied return
        date, reason, and returned items.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - return_date
                - sale_id
                - trader_invoice_number
                - refund_reason_code
              properties:
                return_date:
                  type: string
                  description: >-
                    The date the goods or services were returned, in YYYY-MM-DD
                    format. Future dates are rejected.
                  format: date
                  example: '2026-07-14'
                sale_id:
                  type: string
                  description: The DigiTax ID of the original sale to credit.
                  example: sale_01J55QCA52Q66R42AXNEA8PRYW
                refund_reason_code:
                  type: string
                  description: >-
                    The refund reason code. See the [Refund Reason Code
                    table](https://zm.docs.digitax.tech/docs/sales-data-attributes#refund-reason-code)
                    for possible values.
                  example: '01'
                trader_invoice_number:
                  type: string
                  description: >-
                    The invoice reference from your system. It must be unique
                    across sales, credit notes, and debit notes in the business,
                    including failed transactions.
                  example: '12345678901'
                callback_url:
                  type: string
                  description: >-
                    URL where DigiTax sends an HTTP POST callback with event
                    sale.sync after the credit note successfully syncs with ZRA.
                    Failed syncs do not trigger this callback.
                  example: https://example.com/callback
                items:
                  type: array
                  description: The original sale items being returned.
                  items:
                    type: object
                    required:
                      - item_id
                      - quantity
                      - unit_price
                      - package_unit_quantity
                      - discount_rate
                      - discount_amount
                      - total_amount
                    properties:
                      item_id:
                        type: string
                        description: The DigiTax ID of the item being returned.
                        example: item_01J55G02W1TY6YVFBMJHYKCENK
                      quantity:
                        type: integer
                        description: The quantity of the item being returned.
                        example: 1
                      unit_price:
                        type: number
                        description: >-
                          The price per unit in the original sale's currency, at
                          least 0.0001 with up to four decimal places.
                        example: 1000
                      total_amount:
                        type: number
                        description: >-
                          The returned line total in the original sale's
                          currency, at least 0.0001 with up to four decimal
                          places.
                        example: 1000
                      package_unit_quantity:
                        type: number
                        description: >-
                          The number of packages represented by this returned
                          line item.
                        example: 1
                      discount_rate:
                        type: number
                        description: >-
                          The discount rate for this returned line item, from 0
                          to 1.
                        example: 0
                      discount_amount:
                        type: number
                        description: >-
                          The discount amount in the original sale's currency.
                          Zero is allowed; a nonzero value must be at least
                          0.0001 with up to four decimal places. It must not
                          exceed total_amount.
                        example: 0
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Sales
      summary: List credit notes
      description: Returns a paginated list of credit notes for the authenticated business.
      security:
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - pagination
                  - data
                properties:
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    type: array
                    description: The credit notes in this page.
                    items:
                      $ref: '#/components/schemas/Sale'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
