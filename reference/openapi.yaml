  /stock/adjust:
    put:
      tags:
        - Stock
      summary: Adjust item stock
      description: >-
        Adds to or deducts from an item's stock using the specified stock
        movement type.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item_id
                - quantity
                - action
                - movement_type
              properties:
                item_id:
                  type: string
                  description: The DigiTax ID of the item whose stock is being adjusted.
                  example: item_01HC3J1VVVM05YCTS61G7V3KC6
                quantity:
                  type: number
                  description: The quantity of stock to add or deduct.
                  example: 100
                action:
                  type: string
                  enum:
                    - ADD
                    - DEDUCT
                  description: Whether to add stock or deduct stock.
                  example: ADD
                movement_type:
                  type: string
                  description: >-
                    The stock movement reason code, which must match action. Use
                    an INCOMING code for ADD or an OUTGOING code for DEDUCT. See
                    the [Stock Movement Type
                    table](https://zm.docs.digitax.tech/docs/stock-data-attributes#stock-movement-type)
                    for codes and meanings.
                  example: '01'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - item_code
                  - stock_quantity
                properties:
                  id:
                    type: string
                    description: The DigiTax ID of the adjusted item.
                    example: item_01HC3J1VVVM05YCTS61G7V3KC6
                  item_code:
                    type: string
                    description: >-
                      The item's existing code, generated by DigiTax from the
                      origin country, item type, package unit, quantity unit,
                      and a counter padded to at least seven digits.
                    example: KE1PD-U230411121122
                  stock_quantity:
                    type: number
                    description: The item's stock balance after the adjustment.
                    minimum: 0
                    example: 300
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /notices:
    get:
      summary: Get list of ZRA notices for business
      description: Returns ZRA notices available to the authenticated business.
      tags:
        - Notices
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notice'
        default:
          description: Error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Success:
      type: object
      description: Indicates that the requested operation succeeded.
      required:
        - message
      properties:
        message:
          type: string
          description: A message confirming that the operation succeeded.
    Error:
      type: object
      description: Describes a rejected request or processing error.
      required:
        - message
        - code
      properties:
        message:
          type: string
          description: A message explaining the error.
          example: not a valid currency code
        code:
          type: string
          description: The HTTP status code represented as a string.
          example: '400'
        metadata:
          type: object
          description: Additional error details, when available.
          additionalProperties:
            type: string
    FetchMeta:
      type: object
      required:
        - last_updated
      properties:
        last_updated:
          type: string
          example: '2026-07-14T21:00:00.000Z'
          description: The timestamp when this data was last updated from ZRA.
    Notice:
      type: object
      required:
        - notice_number
        - notice_date
        - title
        - content
        - by
      properties:
        notice_number:
          type: string
          example: 3
          description: The notice number assigned by ZRA.
        notice_date:
          type: string
          description: The date and time when ZRA issued the notice, in ISO 8601 format.
          example: '2026-07-14T21:00:00.000Z'
        title:
          type: string
          description: The notice title.
          example: Call to Action
        content:
          type: string
          description: The notice text.
          example: Call to Action
        by:
          type: string
          description: The organization that issued the notice.
          example: ZAMBIA REVENUE AUTHORITY
        detail_url:
          type: string
          description: URL for additional information about the notice.
    Branch:
      type: object
      required:
        - id
        - tax_pin
        - branch_office_id
        - is_test
        - is_live
      properties:
        id:
          type: string
          description: The DigiTax ID of the branch.
          example: branch_01HC3J1VVVM05YCTS61G7V3KC6
        tax_pin:
          type: string
          description: The Zambia TPIN registered for the branch.
          example: 1012345678
        branch_office_id:
          type: string
          description: The branch identifier assigned by ZRA.
          example: '000'
        branch_office_name:
          type: string
          description: The branch name registered with ZRA.
          example: Head Office
        branch_status_code:
          type: string
          enum:
            - '01'
            - '02'
          description: The branch status code returned by ZRA.
          example: '01'
        province_name:
          type: string
          description: The province where the branch is located.
          example: LUSAKA
        sub_county_name:
          type: string
          description: The sub-county where the branch is located.
          example: Lusaka
        sector_name:
          type: string
          description: The sector where the branch is located.
          example: CBD
        location_description:
          type: string
          description: A description of the branch's location.
          example: 1st Floor
        manager_name:
          type: string
          description: The branch manager's name.
          example: John Doe
        manager_contact:
          type: string
          description: The branch manager's contact number.
          example: '712345678'
        manager_email:
          type: string
          description: The branch manager's email address.
          example: manager@email.com
        is_head_office:
          type: boolean
          description: Indicates whether this branch is the business's head office.
          example: true
        is_test:
          type: boolean
          description: Indicates whether the business is configured as a test business.
          example: true
        is_live:
          type: boolean
          description: Whether the business is marked as live in DigiTax.
          example: true
    Customer:
      type: object
      required:
        - id
        - customer_tpin
      properties:
        id:
          type: string
          description: The DigiTax ID of the customer.
          example: customer_01HC3HTDAXQ50E07CWR2A2CFBD
        customer_name:
          type: string
          description: The customer's name.
          example: John Doe
        email:
          type: string
          description: The customer's email address.
          example: john@doe.com
        is_lpo:
          type: boolean
          description: Is this a Local Purchase Order (LPO) customer?
          example: false
        phone:
          type: string
          description: The customer's phone number.
          example: '+260712345678'
        customer_tpin:
          type: string
          description: The customer's Zambia Taxpayer Identification Number (TPIN).
          example: '8754637189'
        address:
          type: string
          description: The customer's physical address.
          example: 5 Aluguntugui Road, Lusaka
    Import:
      type: object
      required:
        - id
        - task_code
        - declaration_date
        - item_sequence
        - declaration_number
        - hs_code
        - item_name
        - origin_nation_code
        - import_item_status_code
        - export_nation_code
        - package
        - package_unit_code
        - quantity
        - quantity_unit_code
        - gross_weight
        - net_weight
        - invoice_foreign_currency_amount
        - invoice_foreign_currency_code
        - invoice_foreign_currency_rate
        - status
      properties:
        id:
          type: string
          description: The DigiTax ID of the imported item.
          example: import_01HC3J1VVVM05YCTS61G7V3KC6
        task_code:
          type: string
          description: The ZRA task code associated with the import record.
          example: '202607141365045'
        declaration_date:
          type: string
          description: Declaration date-time in ISO 8601 format
          example: '2026-07-14T21:00:00.000Z'
          format: date-time
        item_sequence:
          type: integer
          description: The item's sequence number within the import declaration.
          example: 1
        declaration_number:
          type: string
          description: The import declaration number.
          example: 23BUSIM400040606
        hs_code:
          type: string
          description: The Harmonized System code identifying the imported product.
          example: '30049000'
        item_name:
          type: string
          description: The item name recorded in the import declaration.
          example: MEDICAMENT; NORMAL SALINE 0.9% I.V. [ NS ]; CT; 1450; 500ML;
        origin_nation_code:
          type: string
          description: >-
            The country code for the item's country of origin. See the [Country
            Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#country-codes)
            for possible values.
          example: UG
        import_item_status_code:
          type: string
          description: >-
            The status code assigned to the import item by ZRA. See the [Import
            Item Status
            table](https://zm.docs.digitax.tech/docs/import-data-attributes#import-item-status).
            This is separate from the DigiTax synchronization status field.
          example: '2'
        export_nation_code:
          type: string
          description: >-
            The country code for the country exporting the item. See the
            [Country Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#country-codes).
          example: UG
        package:
          type: integer
          description: The number of packages recorded for the import item.
          example: 17
        package_unit_code:
          type: string
          description: >-
            The code for the unit used to package the import item. See the
            [Packaging Unit Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#packaging-unit-codes).
          example: KGM
        quantity:
          type: integer
          description: The imported item quantity.
          example: 23925
        quantity_unit_code:
          type: string
          description: >-
            The code for the unit used to measure the imported quantity. See the
            [Quantity Unit Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#quantity-unit-codes).
          example: KGM
        gross_weight:
          type: integer
          description: The gross weight recorded for the imported item.
          example: 24650
        net_weight:
          type: integer
          description: The net weight recorded for the imported item.
          example: 23925
        supplier_name:
          type: string
          description: The supplier named in the import declaration.
          example: ABACUS PARENTERAL DRUGS LIMITED
        agent_name:
          type: string
          description: The agent named in the import declaration.
          example: Kandito International Company Kenya Limited
        invoice_foreign_currency_amount:
          type: number
          description: The invoice amount in the foreign currency.
          example: 14355
        invoice_foreign_currency_code:
          type: string
          description: The currency code for the foreign-currency invoice amount.
          example: USD
        invoice_foreign_currency_rate:
          type: number
          description: The exchange rate recorded for the foreign-currency invoice.
          example: 124.45
        status:
          type: string
          enum:
            - PENDING
            - FAILED
            - COMPLETED
          description: The synchronization status of the imported item with ZRA's VSDC.
          example: COMPLETED
        item_id:
          type: string
          description: The DigiTax ID of an item linked to this import record.
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
        item_class_code:
          type: string
          description: >-
            The classification code of the linked item. See the [Item
            Classification
            Table](https://zm.docs.digitax.tech/docs/items-item-classification-table)
            for sandbox and production codes.
          example: '30103604'
        item_code:
          type: string
          description: >-
            The DigiTax-generated code of the linked catalogue item. It combines
            the origin country, item type, package unit, quantity unit, and a
            counter padded to at least seven digits.
          example: KE2CRM0000015
        remarks:
          type: string
          description: Remarks recorded during review of the import item.
          example: unknown item
        approved_quantity:
          type: number
          description: The quantity supplied when linking the import to a catalogue item.
          example: 12
    Item:
      type: object
      description: An item in the authenticated business's DigiTax catalogue.
      required:
        - id
        - item_class_code
        - item_type_code
        - item_name
        - item_number
        - item_code
        - active
        - origin_nation_code
        - package_unit_code
        - quantity_unit_code
        - vat_category_code
        - default_unit_price
        - is_stock_item
        - stock_quantity
        - status
      properties:
        id:
          type: string
          description: The DigiTax ID of the item.
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
        item_class_code:
          type: string
          description: >-
            The ZRA classification code assigned to the item. See the [Item
            Classification
            Table](https://zm.docs.digitax.tech/docs/items-item-classification-table)
            for sandbox and production codes.
          example: 99020000
        item_type_code:
          type: string
          description: >-
            The item type code. See the [Item Type codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#item-type-codes)
            for possible values.
          example: 3
        item_name:
          type: string
          description: The name of the item
          example: DigiTax Product 01
        item_number:
          type: string
          description: A unique human readable identifier for the item
          example: IT24-234-565378-VFRDEF
        origin_nation_code:
          type: string
          description: >-
            The country code for the item's country of origin. See the [Country
            Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#country-codes)
            for possible values.
          example: KE
        package_unit_code:
          type: string
          description: >-
            The package unit code of the item. See the [Packaging Unit Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#packaging-unit-codes).
          example: NT
        quantity_unit_code:
          type: string
          description: >-
            The code for the unit used to measure the item's quantity. See the
            [Quantity Unit Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#quantity-unit-codes).
          example: U
        vat_category_code:
          type: string
          description: >-
            The VAT category code of the item. See the VAT entries in the
            [Taxation Type Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
          example: D
        ipl_category_code:
          type: string
          description: >-
            The Insurance Premium Levy category code of the item, IPL1 or IPL2
            without hyphens. See the IPL entries in the [Taxation Type Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes)
            for their meanings.
          example: IPL1
        tl_category_code:
          type: string
          description: >-
            The Tourism Levy category code of the item. See the TL entry in the
            [Taxation Type Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
          example: TL
        excise_category_code:
          type: string
          description: >-
            The excise duty category code of the item. See the LED entries in
            the [Taxation Type Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
          example: EXEEG
        tot_category_code:
          type: string
          description: >-
            The turnover tax category code of the item. See the TOT entry in the
            [Taxation Type Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#taxation-type-codes).
          example: TOT
        default_unit_price:
          type: number
          description: The default unit price for the item, with up to four decimal places.
          example: 14
        item_code:
          type: string
          description: >-
            The item's code, generated by DigiTax from the origin country, item
            type, package unit, quantity unit, and a counter padded to at least
            seven digits.
          example: ZM2BGBG0000004
        is_stock_item:
          type: boolean
          description: >-
            Whether DigiTax tracks stock movements for the item. Raw materials
            and finished products are stock items; services are not.
          example: true
        stock_quantity:
          type: number
          description: The item's current stock balance.
          minimum: 0
          example: 1000
        active:
          type: boolean
          description: Indicates whether the item is active or not
          example: true
        status:
          type: string
          enum:
            - PENDING
            - FAILED
            - COMPLETED
          description: The item's synchronization status with ZRA's VSDC.
          example: COMPLETED
        bar_code:
          type: string
          description: The bar code or unique product code(UPC) of the item
          example: '012345678905'
        recommended_retail_price:
          type: number
          description: >-
            The retail price recommended by the manufacturer, with up to four
            decimal places.
          example: 1000
    Pagination:
      type: object
      description: Cursor information for a paginated response.
      properties:
        next:
          type: string
          description: >-
            Cursor to use in the after parameter to retrieve the next page, when
            available.
          example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
        previous:
          type: string
          description: >-
            Cursor to use in the before parameter to retrieve the previous page,
            when available.
          example: <entity>_01HC3J1VVVM05YCTS61G7V3KC6
        page_size:
          type: integer
          description: The number of records in this page.
          example: 20
    Sale:
      type: object
      description: A sale transaction recorded for the business.
      required:
        - id
        - sales_tax_summary
        - customer_id
        - receipt_type_code
        - sale_number
        - status
        - item_list
        - sale_date
        - created_at
        - sdc_id
      properties:
        id:
          type: string
          description: The DigiTax ID of the sale.
          example: sale_01HC3HTDAXQ50E07CWR2A2CFBD
        trader_invoice_number:
          type: string
          description: >-
            The invoice reference from your system. It must be unique across
            sales, credit notes, and debit notes in the business, including
            failed transactions.
          example: '12345678901'
        original_sale_id:
          type: string
          description: >-
            The DigiTax ID of the original sale, when this is a credit or debit
            note.
          example: sale_01HC3HTDAXQ50E07CWR2A2CFBD
        receipt_type_code:
          type: string
          description: >-
            The ZRA receipt type code. See the [Receipt Type Codes
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#receipt-type-codes)
            for sale, credit-note, and debit-note codes.
          example: S
        sale_number:
          type: string
          description: The sale number assigned to the transaction.
          example: SAL24-234-565378-VFRDEF
        kind:
          type: string
          enum:
            - NORMAL
            - LPO
            - EXPORT
          description: >-
            The sale type. See [Types of
            Sales](https://zm.docs.digitax.tech/docs/sales-data-attributes#types-of-sales)
            for an overview.
          example: NORMAL
        receipt_number:
          type: integer
          description: The receipt number assigned by ZRA, when available.
          example: 38
        lpo_number:
          type: string
          description: The local purchase order number for an LPO sale.
        destination_country_code:
          type: string
          description: >-
            The destination country code for an export sale. See the [Country
            Codes
            table](https://zm.docs.digitax.tech/docs/items-general-data-attributes#country-codes).
          example: KE
        reason_code:
          type: string
          description: >-
            The reason code for the credit or debit note. See the [Refund Reason
            Code
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#refund-reason-code)
            for credit notes or the [Debit Reason Code
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#debit-reason-code)
            for debit notes.
          example: '01'
        currency_code:
          type: string
          description: >-
            The currency code used for the transaction. See the [Currency Code
            table](https://zm.docs.digitax.tech/docs/sales-data-attributes#currency-code).
          example: ZMW
        exchange_rate:
          type: number
          description: The exchange rate for a sale made in a currency other than ZMW.
          example: 123.45
        sales_tax_summary:
          type: object
          description: Taxable and tax amounts summed across the sale's line items.
          required:
            - taxable_amount_vat
            - taxable_amount_ipl
            - taxable_amount_tl
            - taxable_amount_excise
            - tax_amount_vat
            - tax_amount_ipl
            - tax_amount_tl
            - tax_amount_excise
            - taxable_amount_tot
            - tax_amount_tot
          properties:
            taxable_amount_vat:
              type: number
              description: Total amount subject to VAT.
              example: 0
            taxable_amount_ipl:
              type: number
              description: Total amount subject to Insurance Premium Levy.
              example: 517.24
            taxable_amount_tl:
              type: number
              description: Total amount subject to Tourism Levy.
              example: 0
            taxable_amount_excise:
              type: number
              description: Total amount subject to excise duty.
              example: 0
            taxable_amount_tot:
              type: number
              description: Total amount subject to turnover tax.
              example: 0
            tax_amount_vat:
              type: number
              description: Total VAT charged.
              example: 0
            tax_amount_ipl:
              type: number
              description: Total Insurance Premium Levy charged.
              example: 517.24
            tax_amount_tl:
              type: number
              description: Total Tourism Levy charged.
              example: 0
            tax_amount_excise:
              type: number
              description: Total excise duty charged.
              example: 0
            tax_amount_tot:
              type: number
              description: Total turnover tax charged.
              example: 0
        customer_id:
          type: string
          description: The DigiTax ID of the customer associated with the sale.
          example: customer_01HC3HTDAXQ50E07CWR2A2CFBD
        internal_data:
          type: string
          description: Internal data returned by ZRA for the transaction.
          example: PB3ZSZP3RZR3AUPYBYLUTFJDIA
        receipt_signature:
          type: string
          description: The receipt signature returned by ZRA.
          example: 3JYZVPTPMYBGHG4A
        sdc_id:
          type: string
          description: >-
            The identifier of the sales data controller (SDC) that processed the
            transaction.
          example: SDC1234567890
        receipt_url:
          type: string
          description: URL for the ZRA receipt.
          example: >-
            https://sandboxportal.zra.org.zm/common/link/ebm/receipt/indexEbmReceiptData?Data=2002720806000YXO7XG3HRQ7OOWDH
          format: url
        status:
          type: string
          enum:
            - pending
            - failed
            - completed
          description: The transaction's synchronization status with ZRA.
          example: completed
        sale_date:
          type: string
          description: The date of the sale in YYYY-MM-DD format.
          example: '2026-07-14'
        created_at:
          type: string
          description: >-
            The date-time when the record was created (YYYY-MM-DD
            HH:MM:SS.ffffff+TZ)
          example: '2026-07-14 12:00:32.491899+00'
        cash_discount_rate:
          type: number
          description: >-
            The sale-level discount rate as a decimal; for example, 0.1
            represents 10%.
          example: 0
        cash_discount_amount:
          type: number
          description: The sale-level discount amount, with up to four decimal places.
          example: 0
        item_list:
          type: array
          description: >-
            The products or services included in the transaction, with their
            quantities, prices, discounts, and taxes.
          items:
            $ref: '#/components/schemas/SaleItem'
    SaleItem:
      type: object
      description: A line item included in a sale.
