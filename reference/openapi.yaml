        email:
          type: string
          description: The supplier's email address.
          example: elite@books.com
        phone:
          type: string
          description: The supplier's phone number.
          example: '+260712345678'
        supplier_tpin:
          type: string
          description: The supplier's taxpayer identification number (TPIN).
          example: '1234562718'
    Purchase:
      type: object
      description: A purchase recorded for the authenticated business.
      required:
        - id
        - invoice_number
        - receipt_type_code
        - payment_type_code
        - purchase_date
        - purchase_number
        - supplier_invoice_number
        - supplier_id
        - item_list
        - status
        - purchase_status_code
      properties:
        id:
          type: string
          description: The DigiTax ID of the purchase.
          example: purchase_01HC3J1VVVM05YCTS61G7V3KC6
        invoice_number:
          type: integer
          description: The purchase invoice number generated by DigiTax for the branch.
          example: 4000
        receipt_type_code:
          type: string
          description: The ZRA receipt type code for the purchase.
          example: P
        payment_type_code:
