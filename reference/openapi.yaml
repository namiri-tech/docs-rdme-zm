        - id
        - quantity
        - unit_price
        - supply_price
        - discount_rate
        - discount_amount
        - item_id
        - total_amount
        - vat_tax_amount
        - vat_taxable_amount
      properties:
        id:
          type: string
          description: The DigiTax ID of this sale line item.
          example: saleitem_01HC3J1VVVM05YCTS61G7V3KC6
        quantity:
          type: number
          description: The number of units in the sale line item.
          example: 10
        total_amount:
          type: number
          description: The total amount for the line item,  with up to four decimal places.
          example: 1160
        vat_tax_amount:
          type: number
          description: The VAT charged on the line item, with up to four decimal places.
          example: 160
        vat_taxable_amount:
          type: number
          description: The line item amount subject to VAT, with up to four decimal places.
          example: 1000
        ipl_tax_amount:
          type: number
          description: >-
            The Insurance Premium Levy charged on the line item, with up to four
            decimal places.
          example: 160
        ipl_taxable_amount:
          type: number
          description: >-
            The line item amount subject to Insurance Premium Levy,  with up to
            four decimal places.
          example: 1000
        tl_tax_amount:
          type: number
          description: >-
            The Tourism Levy charged on the line item, with up to four decimal
            places.
          example: 160
        tl_taxable_amount:
          type: number
          description: >-
            The line item amount subject to Tourism Levy, with up to four
            decimal places.
          example: 1000
        excise_tax_amount:
          type: number
          description: >-
            The excise duty charged on the line item, with up to four decimal
            places.
          example: 160
        excise_taxable_amount:
          type: number
          description: >-
            The line item amount subject to excise duty, with up to four decimal
            places.
          example: 1000
        tot_tax_amount:
          type: number
          description: >-
            The turnover tax charged on the line item,  with up to four decimal
            places.
          example: 160
        tot_taxable_amount:
          type: number
          description: >-
            The line item amount subject to turnover tax, with up to four
            decimal places.
          example: 1000
        unit_price:
          type: number
          description: The price per unit of the item,  with up to four decimal places.
          example: 116
        supply_price:
          type: number
          description: >-
            The supply amount recorded for the line item, with up to four
            decimal places.
          example: 1160
        discount_rate:
          type: number
          description: The discount rate applied to the line item, as a decimal.
          example: 0
        discount_amount:
          type: number
          description: >-
            The discount amount applied to the line item, with up to four
            decimal places.
          example: 0
        item_id:
          type: string
          description: The DigiTax ID of the catalogue item.
          example: item_01HC3J1VVVM05YCTS61G7V3KC6
    Supplier:
      type: object
